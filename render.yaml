services:
  - type: web
    name: omnilink-frontend
    env: static
    buildCommand: ./render-build.sh
    staticPublishPath: omnilink_frontend/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: omnilink-landing
    env: static
    buildCommand: cd omnilink_landing && npm ci && npm run build
    staticPublishPath: omnilink_landing/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
